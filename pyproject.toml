[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dubbing-studio"
version = "0.1.0"
description = "Open-source desktop tool for WAV speech analysis and browser-assisted dubbing comparison."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Dubbing Studio" }]
keywords = ["ai", "dubbing", "voice", "media", "automation"]
dependencies = [
  "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[project.scripts]
ai-dubbing-studio = "ai_dubbing_studio.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
